name: Build APK

# Runs on every push to main, and can be started by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build the APK
        run: gradle assembleDebug --stacktrace

      - name: Rename the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CAWCS.apk

      - name: Save the APK on the Actions run
        uses: actions/upload-artifact@v4
        with:
          name: CAWCS-apk
          path: CAWCS.apk

      - name: Publish the APK as a downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: CAWCS build ${{ github.run_number }}
          body: Install CAWCS.apk on an Android phone (allow "Install unknown apps" when asked).
          files: CAWCS.apk
